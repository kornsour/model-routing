[project]
name = "invoicing"
version = "0.1.0"
description = "Small stdlib-only invoicing library and CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

[project.scripts]
invoicing = "invoicing.cli:main"
