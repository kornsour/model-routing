[project]
name = "logproc"
version = "0.1.0"
description = "Small stdlib-only log/CSV processing package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logproc"]

[project.scripts]
logproc = "logproc.cli:main"
