[project]
name = "notes"
version = "0.1.0"
description = "Small stdlib-only CLI notes and to-do tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[project.scripts]
notes = "notes.cli:main"
