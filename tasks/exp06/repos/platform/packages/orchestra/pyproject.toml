[project]
name = "orchestra"
version = "0.7.0"
description = "Deterministic job-DAG scheduler used to plan and simulate batch pipelines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]

[project.scripts]
orchestra = "orchestra.cli:main"
