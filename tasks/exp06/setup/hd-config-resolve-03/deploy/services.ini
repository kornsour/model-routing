; services.ini - production service configuration (rendered by the deploy job)

[DEFAULT]
region = us-east-2
log_level = info
timeout = 30

[base]
host = ${name}.internal
port = 8080
url = http://${host}:${port}/  ; trailing slash is load-bearing
name = base

[api : base]
name = api
port = 9090
replicas = 3
banner = "Welcome; please log in"  ; quoted: the semicolon is part of the value
motd = Maintenance window # Sunday 02:00 UTC

[api-canary : api]
name = api-canary
replicas = 1
log_level = debug

[worker : base]
name = worker
queue = ${api:name}-jobs
url = ${base:url}work
timeout = $${seconds}

[billing]
endpoint = ${ledger:url}
retries = 5

[ledger]
url = ${billing:endpoint}/v2
