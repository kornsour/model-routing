# List prices in USD per 1M tokens.  Every provider's usage is priced from this
# table so runs are comparable regardless of how the call was actually billed
# (subscription allowance, API key, gateway).  The Claude CLI also reports its
# own list-price cost; the report shows both so the table can be cross-checked.
#
# cache_read / cache_write are absolute $/1M prices for cached input.  For
# Anthropic: read = 0.1x input (0.025x on Fable 5.1), write = 1.25x input for
# the 5-minute TTL and cache_write_1h = 2x input for the 1-hour TTL (which is
# what the Claude Code harness uses - confirmed against its reported cost).
# Sources: the bundled claude-api skill price table (cached 2026-06-24) and
# Anthropic's pricing page.  OpenAI rows: see `verified`.
#
# Aliases map what you pass to a CLI (or what it resolves to) onto a row.

[anthropic."claude-haiku-4-5"]
input = 1.00
cache_read = 0.10
cache_write = 1.25
cache_write_1h = 2.00
output = 5.00
aliases = ["haiku", "claude-haiku-4-5-20251001"]

[anthropic."claude-sonnet-5"]
input = 2.00
cache_read = 0.20
cache_write = 2.50
cache_write_1h = 4.00
output = 10.00
aliases = ["sonnet"]

