[project]
name = "model-routing"
version = "0.1.0"
description = "Experiment harness for measuring model-routing tradeoffs: cost per completed task, cache economics, and router overhead across LLM providers (and, later, other ML paradigms)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrew Kaiserauer" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "pyright>=1.1.414",
    "pre-commit>=4.6.2",
]

[project.scripts]
model-routing = "model_routing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_routing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS template; line length is not meaningful there.
"src/model_routing/dashboard.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
