# SMOKE for the exp06 ladder arms (section 7.6 item 7): every path on real
# models before the main run; results are not analysed.
# exp06 ladder arms (docs/experiments/exp06-route-on-evidence/paper.md, section 7.2),
# exploratory: nothing here is registered (Appendix C sign-off is pending),
# and the static arms are taken from the Stage 0 calibration run
# (experiments/exp06-route-on-evidence/exp06_calibrate.toml) instead of being re-run.
#
#   make dispatch-estimate EXP=experiments/exp06-route-on-evidence/exp06_ladder.toml
#   make dispatch-run      EXP=experiments/exp06-route-on-evidence/exp06_ladder.toml BUDGET=...
#
# Stage 0 found no measured-hard task (H0 not met), so this run measures what
# the ladder costs on work without frontier headroom.  static_sonnet is re-run
# fresh here as the primary control; static_opus is taken from calibration.
#
# Arms run here, in budget-priority order (section 7.2):
#   ladder                 advisor rung + forced advisor check + deployable
#                          verifier (visible + own acceptance tests + scope),
#                          K=2, clean-checkout handoff, ESCALATE honoured
#   explore_handoff_clean  no advisor; verifier, K=2, clean handoff
#   sonnet_advisor         advisor rung + forced check only (L2)
#   ladder_noforce         ladder without the forced advisor check
#   static_sonnet          fresh control
# Not run: ladder_noL0 / L5 (no ambiguous stratum), sonnet_effort (effort
# cannot change mid-session in headless mode), C2_trained (no tuning split).

[experiment]
name = "exp06_ladder_smoke"
kind = "dispatch"
tasks = "tasks/exp06/tasks.jsonl"
trials = 1
task_ids = ["tb-cron-03", "or-perf-04"]
order = "randomized"
seed = 20260930
max_turns = 40
hypothesis = "exp06 L1/L2/L6 (exploratory): evidence-driven escalation from a Sonnet start."
primary = { treatment = "ladder", control = "explore_handoff_clean" }
margin_pp = 10
max_budget_per_session_usd = 5.0
parent = "sonnet"
menu = ["sonnet", "opus"]

[auth]
mode = "subscription"

[candidates.sonnet]
provider = "claude_cli"
model = "claude-sonnet-5-5"

[candidates.sonnet_adv]
provider = "claude_cli"
model = "claude-sonnet-5-5"
advisor = "claude-opus-5-5"

[candidates.opus]
provider = "claude_cli"
model = "claude-opus-5-5"

[[policies]]
name = "static_sonnet"
kind = "spawn_static"
candidate = "sonnet"

[[policies]]
name = "ladder"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
forced_check = true
verifier = "verifier"
k = 2
handoff = "clean"
escalate = true

[[policies]]
name = "explore_handoff_clean"
kind = "spawn_ladder"
worker = "sonnet"
frontier = "opus"
verifier = "verifier"
k = 2
handoff = "clean"

[[policies]]
name = "sonnet_advisor"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
forced_check = true

[[policies]]
name = "ladder_noforce"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
verifier = "verifier"
k = 2
handoff = "clean"
escalate = true
