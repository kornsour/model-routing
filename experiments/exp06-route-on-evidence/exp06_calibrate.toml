# exp06 Stage 0 (docs/experiments/exp06-route-on-evidence/paper.md, section 7.1): measure
# per-task pass rates on the mid-tier and frontier models to evaluate H0
# (headroom: frontier >= 2/3, mid-tier <= 1/3 on at least 10 tasks or 10%).
# Exploratory: this run is not registered (Appendix C sign-off is pending).
#
#   make dispatch-estimate EXP=experiments/exp06-route-on-evidence/exp06_calibrate.toml
#   make dispatch-run      EXP=experiments/exp06-route-on-evidence/exp06_calibrate.toml BUDGET=...
#
# Models are pinned to exact ids (Claude Code >= 2.1.285 knows the 5.5 models;
# the `sonnet`/`opus` aliases resolved to the 5.0 models on 2.1.278).  A first
# attempt on Sonnet 5 / Opus 5 was stopped after 14 cells when the study moved
# to the current models (results/exp06_calibrate/20260929-201525-v5.0-aborted).

[experiment]
name = "exp06_calibrate"
kind = "dispatch"
tasks = "tasks/exp06/tasks.jsonl"
trials = 3
order = "randomized"
seed = 20260929
max_turns = 40
hypothesis = "Stage 0 / H0: measured pass rate per task on Haiku 4.5, Sonnet 5.5 and Opus 5.5."
primary = { treatment = "static_sonnet", control = "static_opus" }
margin_pp = 10
max_budget_per_session_usd = 5.0
parent = "sonnet"
menu = ["haiku", "sonnet", "opus"]

[auth]
mode = "subscription"

[candidates.haiku]
provider = "claude_cli"
model = "claude-haiku-4-5"

[candidates.sonnet]
provider = "claude_cli"
model = "claude-sonnet-5-5"

[candidates.opus]
provider = "claude_cli"
model = "claude-opus-5-5"

[[policies]]
name = "static_haiku"
kind = "spawn_static"
candidate = "haiku"

[[policies]]
name = "static_sonnet"
kind = "spawn_static"
candidate = "sonnet"

[[policies]]
name = "static_opus"
kind = "spawn_static"
candidate = "opus"
