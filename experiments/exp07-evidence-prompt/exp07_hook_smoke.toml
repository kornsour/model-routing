# exp07 gate 1 SMOKE (not analysed): does the request-logging hook fire for the
# advisor in headless mode, and does it leave the advisor's cost unchanged? Same
# arm with the hook on and off, 2 tasks x 1 trial.

[experiment]
name = "exp07_hook_smoke"
kind = "dispatch"
tasks = "tasks/exp06/tasks.jsonl"
extra_tasks = ["tasks/exp06/tasks_ext.jsonl"]
# exp06 protocol label "unsolved" (neither model above 1/3), findings 2026-10-02.
task_ids = ["tb-semver-01", "or-retries-02"]
exclude_task_ids = ["ha-archive-birchwood-05", "ha-verify-suite-16", "hc-history-csv-05"]
trials = 1
order = "randomized"
seed = 20261005
max_turns = 40
per_task_max_turns = true
hypothesis = "E1: the evidence-gated advisor note lowers cost per completed task against exp06's note on easy tasks, with completion non-inferior within 5 points."
primary = { treatment = "hook_on", control = "hook_off" }
margin_pp = 5
max_budget_per_session_usd = 5.0
parent = "sonnet"
menu = ["sonnet", "opus"]

[auth]
mode = "subscription"

[candidates.sonnet]
provider = "claude_cli"
model = "claude-sonnet-5-5"

[candidates.sonnet_adv]
provider = "claude_cli"
model = "claude-sonnet-5-5"
advisor = "claude-opus-5-5"
request_log = true

[candidates.sonnet_adv_nolog]
provider = "claude_cli"
model = "claude-sonnet-5-5"
advisor = "claude-opus-5-5"

[candidates.opus]
provider = "claude_cli"
model = "claude-opus-5-5"

[[policies]]
name = "hook_on"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
advisor_note = "standard"
verifier = "verifier"
k = 2
handoff = "clean"
escalate = true

[[policies]]
name = "hook_off"
kind = "spawn_ladder"
worker = "sonnet_adv_nolog"
frontier = "opus"
advisor_note = "standard"
verifier = "verifier"
k = 2
handoff = "clean"
escalate = true
