# Experiment 5 (ChatGPT/Codex track) - dispatch-time routing, same design as
# exp05_dispatch.toml, run against the Codex CLI / OpenAI candidates instead.
# A replication on a second model family, not part of H-D1.  See
# docs/experiments/dispatch-routing.md ("Codex track caveats") for where this
# track cannot match the Claude one (no in-session spend cap, turn cap counted
# in tool calls, no-tools = read-only sandbox), checked against codex-cli 0.154.0.
#
#   make dispatch-estimate EXP=experiments/agentic/exp05_dispatch_codex.toml
#   (smoke first: experiments/agentic/exp05_smoke_paths_codex.toml)

[experiment]
name = "exp05_dispatch_codex"
kind = "dispatch"
tasks = "tasks/agentic/tasks.jsonl"
trials = 3                      # pre-registered
order = "randomized"            # by_policy | by_task | randomized
seed = 20260923
max_turns = 40
hypothesis = "Spawning with the parent-recommended model lowers cost per completed task vs. spawning on the parent model, with pass rate non-inferior within the margin."
primary = { treatment = "C1_inline", control = "B" }   # pre-registered (see exp05_dispatch.toml)
margin_pp = 10                  # pre-registered non-inferiority margin, percentage points (see exp05_dispatch.toml)
max_budget_per_session_usd = 2.0
parent = "sol"                  # the model the user's main session runs on
# The menu the parent (C1 / C1_inline) and classifier (C2) choose from, cheapest first.
menu = ["luna", "terra", "sol"]

[auth]
mode = "subscription"

# Efforts are pinned to the Codex model catalog's defaults as of 2026-09-23
# (`codex debug models`: luna medium, terra medium, sol low) so a catalog change
# between runs cannot move them silently.  Because sol already defaults to
# low, the Claude track's `opus_low` / `static_opus_low` arm has no distinct
# Codex counterpart (sol supports nothing below low) and is left out.
[candidates.luna]
provider = "codex_cli"
model = "gpt-5.6-luna"
effort = "medium"

[candidates.terra]
provider = "codex_cli"
model = "gpt-5.6-terra"
effort = "medium"

[candidates.sol]
provider = "codex_cli"
model = "gpt-5.6-sol"
effort = "low"

[[policies]]
name = "A"
kind = "in_session"

[[policies]]
name = "A_switch"
kind = "in_session"
switch_to = "terra"

[[policies]]
name = "B"
kind = "spawn_static"
candidate = "sol"               # = parent

[[policies]]
name = "C1"                     # pessimistic: forked router call re-reads the parent context
kind = "spawn_parent_pick"

[[policies]]
name = "C1_inline"              # realistic: brief + pick in one parent turn (codex exec fork), marginal tokens billed
kind = "spawn_parent_pick_inline"

[[policies]]
name = "C2"
kind = "spawn_classifier"
classifier = "luna"

[[policies]]
name = "D"
kind = "spawn_cascade"
chain = ["luna", "terra", "sol"]
escalate_on_error = true        # also escalate when the attempt hits the turn cap (2026-09-24 smoke)

[[policies]]
name = "D_ideal"                # upper bound: hidden tests as a perfect checker (not deployable)
kind = "spawn_cascade"
chain = ["luna", "terra", "sol"]
escalate_on = "hidden"

[[policies]]
name = "static_haiku"           # name kept for the report's H-D6 comparison; luna is the cheap tier here
kind = "spawn_static"
candidate = "luna"

[[policies]]
name = "static_haiku_terse"
kind = "spawn_static"
candidate = "luna"
brief = "terse"

[[policies]]
name = "static_sonnet"
kind = "spawn_static"
candidate = "terra"
