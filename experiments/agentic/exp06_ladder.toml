# exp06 ladder arms (docs/paper/exp06-route-on-evidence.md, section 7.2),
# exploratory: nothing here is registered (Appendix C sign-off is pending),
# and the static arms are taken from the Stage 0 calibration run
# (experiments/agentic/exp06_calibrate.toml) instead of being re-run.
#
#   make dispatch-estimate EXP=experiments/agentic/exp06_ladder.toml
#   make dispatch-run      EXP=experiments/agentic/exp06_ladder.toml BUDGET=...
#
# Arms run here, in budget-priority order (section 7.2):
#   ladder                 advisor rung + forced advisor check + deployable
#                          verifier (visible + own acceptance tests + scope),
#                          K=2, clean-checkout handoff, ESCALATE honoured
#   explore_handoff_clean  no advisor; verifier, K=2, clean handoff
#   sonnet_advisor         advisor rung + forced check only (L2)
# Not run: ladder_noL0 / L5 (no ambiguous stratum), sonnet_effort (effort
# cannot change mid-session in headless mode), C2_trained (no tuning split).

[experiment]
name = "exp06_ladder"
kind = "dispatch"
tasks = "tasks/exp06/tasks.jsonl"
trials = 3
order = "randomized"
seed = 20260930
max_turns = 40
hypothesis = "exp06 L1/L2/L6 (exploratory): evidence-driven escalation from a Sonnet start."
primary = { treatment = "ladder", control = "explore_handoff_clean" }
margin_pp = 10
max_budget_per_session_usd = 5.0
parent = "sonnet"
menu = ["sonnet", "opus"]

[auth]
mode = "subscription"

[candidates.sonnet]
provider = "claude_cli"
model = "sonnet"

[candidates.sonnet_adv]
provider = "claude_cli"
model = "sonnet"
advisor = "opus"

[candidates.opus]
provider = "claude_cli"
model = "opus"

[[policies]]
name = "ladder"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
forced_check = true
verifier = "verifier"
k = 2
handoff = "clean"
escalate = true

[[policies]]
name = "explore_handoff_clean"
kind = "spawn_ladder"
worker = "sonnet"
frontier = "opus"
verifier = "verifier"
k = 2
handoff = "clean"

[[policies]]
name = "sonnet_advisor"
kind = "spawn_ladder"
worker = "sonnet_adv"
frontier = "opus"
forced_check = true
