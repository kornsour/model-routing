# Experiment 5 - dispatch-time routing (agentic, multi-turn, sandboxed).
# See docs/experiments/dispatch-routing.md and the analysis plan in
# docs/experiments/preregistration-exp05.md.  Pre-registered fields are
# marked; change them only before the confirmatory run, and record why in the
# preregistration doc.  `make dispatch-preregister EXP=... WRITE=1` appends the
# [preregistration] table that freezes this design against the task set; the
# report calls a run "confirmatory" only when it matches that table.

[experiment]
name = "exp05_dispatch"
kind = "dispatch"
tasks = "tasks/agentic/tasks.jsonl"
trials = 3                      # pre-registered: 3 trials per (task, policy); reports variance
order = "randomized"            # pre-registered: randomized block design per (task, trial)
seed = 20260923                 # seeds the block order and any task sampling
max_turns = 40                  # per-session turn cap for every policy (pilot: up to 23 used)
hypothesis = "Spawning with the parent-recommended model lowers cost per completed task vs. spawning on the parent model, with pass rate non-inferior within the margin."
# pre-registered primary comparison: the *inline* pick (the parent writes the
# brief and the model choice in one turn; only the pick's marginal tokens are
# billed) against spawning on the parent's own model.  The forked C1 stays in
# the run as the pessimistic variant (secondary).
primary = { treatment = "C1_inline", control = "B" }
# pre-registered non-inferiority margin, percentage points.  10, not 5: the
# pilot's C1/B outcomes disagreed on 33% of tasks; at that discordance a 5-pt
# margin needs ~1,000 paired task-trials (~330 tasks x 3), a 10-pt margin ~260
# (~90 tasks x 3).  10 pts still answers "does it save real money without a
# noticeable quality drop?" at a cost worth paying.  Decided 2026-09-23, before
# any confirmatory data (see docs/experiments/preregistration-exp05.md).
margin_pp = 10
max_budget_per_session_usd = 2.0
parent = "opus"                 # the model the user's main session runs on
# The menu the parent (C1 / C1_inline) and classifier (C2) choose from, cheapest first.
menu = ["haiku", "sonnet", "opus_low", "opus"]

[auth]
mode = "subscription"

# Candidates use the CLI aliases; every session records the resolved model id
# (pilot: claude-haiku-4-5, claude-sonnet-5, claude-opus-5) and the report
# should be read against those ids, since aliases can move between runs.
[candidates.haiku]
provider = "claude_cli"
model = "haiku"

[candidates.sonnet]
provider = "claude_cli"
model = "sonnet"

[candidates.opus]
provider = "claude_cli"
model = "opus"

[candidates.opus_low]
provider = "claude_cli"
model = "opus"
effort = "low"

[[policies]]
name = "A"
kind = "in_session"

[[policies]]
name = "A_switch"
kind = "in_session"
switch_to = "sonnet"

[[policies]]
name = "B"
kind = "spawn_static"
candidate = "opus"              # = parent

[[policies]]
name = "C1"                     # pessimistic: forked router call re-reads the parent context
kind = "spawn_parent_pick"

[[policies]]
name = "C1_inline"              # realistic: brief + pick in one parent turn, marginal tokens billed
kind = "spawn_parent_pick_inline"

[[policies]]
name = "C2"
kind = "spawn_classifier"
classifier = "haiku"

[[policies]]
name = "D"
kind = "spawn_cascade"
chain = ["haiku", "sonnet", "opus"]
escalate_on_error = true        # also escalate when the attempt hits the turn cap (2026-09-24 smoke)

[[policies]]
name = "D_ideal"                # upper bound: hidden tests as a perfect checker (not deployable)
kind = "spawn_cascade"
chain = ["haiku", "sonnet", "opus"]
escalate_on = "hidden"

[[policies]]
name = "static_haiku"
kind = "spawn_static"
candidate = "haiku"

[[policies]]
name = "static_haiku_terse"
kind = "spawn_static"
candidate = "haiku"
brief = "terse"

[[policies]]
name = "static_sonnet"
kind = "spawn_static"
candidate = "sonnet"

[[policies]]
name = "static_opus_low"
kind = "spawn_static"
candidate = "opus_low"
